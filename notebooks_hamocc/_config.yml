# Jupyter Book configuration for the HAMOCC diagnostics
title                       : HAMOCC diagnostics
author                      : NorESM
copyright                   : "2026"
logo                        : ../assets/logo.png

execute:
  execute_notebooks: auto
  timeout: -1      # seconds; or -1 for no limit
  allow_errors: false

repository:
  url: https://github.com/NorESMhub/blomster
  path_to_book: notebooks_hamocc
  branch: master

html:
  use_issues_button: false
  use_repository_button: true
  home_page_in_navbar: true

only_build_toc_files: true

sphinx:
  config:
    nb_render_text_lexer: "myst-ansi"
